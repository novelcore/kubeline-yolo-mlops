site_name: Kubeline YOLO MLOps
site_description: End-to-end YOLO pose estimation pipeline on the KAOS platform
site_author: Novelcore
site_url: https://novelcore.github.io/kubeline-yolo-mlops/

repo_name: novelcore/kubeline-yolo-mlops
repo_url: https://github.com/novelcore/kubeline-yolo-mlops
edit_uri: edit/docs/.docs/

docs_dir: .docs

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
  - git-committers:
      repository: novelcore/kubeline-yolo-mlops
      branch: docs
      enabled: !ENV [CI, false]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelcore/kubeline-yolo-mlops
  generator: false

nav:
  - Home: index.md
  - Quick Start:
      - Prerequisites: quick-start/prerequisites.md
  - Platform Setup:
      - Overview: platform-setup/index.md
      - Prerequisites: platform-setup/prerequisites.md
      - Infrastructure Setup: platform-setup/kaos-setup.md
  - Configure Your Experiment:
      - Overview: configure/index.md
      - pipeline_config.yaml: configure/pipeline-config.md
      - Datasets: configure/datasets.md
  - Run a Pipeline:
      - Argo Workflows UI: run/argo-ui.md
      - GitHub PR: run/github-pr.md
      - KAOS MCP Agent: run/kaos-mcp.md
  - Monitor & Debug:
      - Argo Logs: monitor/argo-logs.md
      - MLflow Dashboard: monitor/mlflow.md
  - Results & Promotion:
      - Reading Metrics: results/metrics.md
      - Promoting a Model: results/promotion.md
  - Reference:
      - Architecture: reference/architecture.md
      - Config Schema: reference/config-schema.md
      - Environment Variables: reference/env-vars.md
      - Pipeline Steps: reference/steps.md
      - Troubleshooting: reference/troubleshooting.md

copyright: "Copyright &copy; 2026 Novelcore"

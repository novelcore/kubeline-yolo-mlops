[project]
name = "model-registration"
version = "0.1.0"
description = "Registers trained models to the MLflow model registry for the KAOS YOLO MLOps pipeline."
authors = [
    { name = "Example Org", email = "dev@example.org" }
]
readme = "README.md"

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<=3.14"
pydantic = "^2.11.5"
typer = "^0.16.0"
pydantic-settings = "^2.10.1"
mlflow = ">=3.0,<4"
boto3 = ">=1.34"
# Zitadel machine-identity auth for MLflow (bearer JWT, no basic-auth).
authlib = "^1.3.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[tool.poetry.scripts]
model-registration = "app.cli:main"

# MLflow request-auth provider plugin: MLflow loads this entrypoint and selects it
# when MLFLOW_TRACKING_AUTH=zitadel. Mints/refreshes a Zitadel bearer JWT per request.
[tool.poetry.plugins."mlflow.request_auth_provider"]
zitadel = "app.mlflow_zitadel_auth:ZitadelRequestAuthProvider"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "mlflow", "mlflow.*", "torch", "torch.*"]
ignore_missing_imports = true

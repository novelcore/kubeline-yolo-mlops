[project]
name = "model-quantization"
version = "0.1.0"
description = "Shared quantization export tail — PTQ (Ultralytics) and QAT passthrough to INT8 TFLite."
authors = [
    { name = "Example Org", email = "dev@example.org" }
]
readme = "README.md"

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<=3.14"
pydantic = "^2.11.5"
typer = "^0.16.0"
pydantic-settings = "^2.10.1"
ultralytics = ">=8.2"
mlflow = ">=3.0,<4"
boto3 = ">=1.34"
# Zitadel machine-identity auth for MLflow (bearer JWT). Registered as the
# mlflow.request_auth_provider entrypoint 'zitadel' below.
authlib = "^1.3.0"
pyyaml = ">=6.0"
numpy = ">=1.24"
pillow = ">=10.0"
ai-edge-litert = ">=1.0"
# System-resource sampling for MLflow system metrics during the (long, CPU-heavy)
# export. pynvml is optional at runtime (GPU metrics only for QAT-on-GPU runs).
psutil = ">=5.9"
pynvml = ">=11.5"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
types-pyyaml = ">=6.0"
types-psutil = ">=5.9"

[tool.poetry.scripts]
model-quantization = "app.cli:main"

# MLflow request-auth provider plugin: MLflow loads this entrypoint and selects it
# when MLFLOW_TRACKING_AUTH=zitadel. Mints/refreshes a Zitadel bearer JWT per request.
[tool.poetry.plugins."mlflow.request_auth_provider"]
zitadel = "app.mlflow_zitadel_auth:ZitadelRequestAuthProvider"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
